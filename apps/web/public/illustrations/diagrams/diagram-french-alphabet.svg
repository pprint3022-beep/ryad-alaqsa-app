<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="diaTitle diaDesc">
  <title id="diaTitle">L'alphabet français : Aa à Ee</title>
  <desc id="diaDesc">Cinq cartes d'apprentissage avec les lettres Aa Bb Cc Dd Ee et les mots exemples Arbre, Ballon, Camion, Dauphin, École, avec traductions arabes et la mention 26 lettres.</desc>
  <rect width="640" height="360" fill="#fffaf0"/>
  <rect x="12" y="12" width="616" height="56" rx="18" fill="#1f6b3a"/>
  <text x="32" y="48" font-family="sans-serif" font-size="23" font-weight="bold" fill="#fffaf0">L'alphabet français — الأبجدية الفرنسية</text>
  <text x="320" y="104" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f08a24" text-anchor="middle">Aa Bb Cc Dd Ee ...</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="18" y="118" width="112" height="158" rx="16" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/>
      <text x="74" y="166" font-size="36" font-weight="bold" fill="#1f6b3a">Aa</text>
      <text x="74" y="198" font-size="17" fill="#1f2937">Arbre</text>
      <text x="74" y="232" font-size="17" fill="#f08a24" direction="rtl">شجرة</text>
    </g>
    <g>
      <rect x="140" y="118" width="112" height="158" rx="16" fill="#ffffff" stroke="#f08a24" stroke-width="3"/>
      <text x="196" y="166" font-size="36" font-weight="bold" fill="#f08a24">Bb</text>
      <text x="196" y="198" font-size="17" fill="#1f2937">Ballon</text>
      <text x="196" y="232" font-size="17" fill="#1f6b3a" direction="rtl">بالون</text>
    </g>
    <g>
      <rect x="262" y="118" width="112" height="158" rx="16" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/>
      <text x="318" y="166" font-size="36" font-weight="bold" fill="#1f6b3a">Cc</text>
      <text x="318" y="198" font-size="17" fill="#1f2937">Camion</text>
      <text x="318" y="232" font-size="17" fill="#f08a24" direction="rtl">شاحنة</text>
    </g>
    <g>
      <rect x="384" y="118" width="112" height="158" rx="16" fill="#ffffff" stroke="#f08a24" stroke-width="3"/>
      <text x="440" y="166" font-size="36" font-weight="bold" fill="#f08a24">Dd</text>
      <text x="440" y="198" font-size="17" fill="#1f2937">Dauphin</text>
      <text x="440" y="232" font-size="17" fill="#1f6b3a" direction="rtl">دلفين</text>
    </g>
    <g>
      <rect x="506" y="118" width="112" height="158" rx="16" fill="#ffffff" stroke="#2e8b57" stroke-width="3"/>
      <text x="562" y="166" font-size="36" font-weight="bold" fill="#1f6b3a">Ee</text>
      <text x="562" y="198" font-size="17" fill="#1f2937">École</text>
      <text x="562" y="232" font-size="17" fill="#f08a24" direction="rtl">مدرسة</text>
    </g>
  </g>
  <rect x="120" y="296" width="400" height="46" rx="18" fill="#ff9f1c"/>
  <text x="320" y="328" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">26 lettres — 26 حرفًا</text>
</svg>
