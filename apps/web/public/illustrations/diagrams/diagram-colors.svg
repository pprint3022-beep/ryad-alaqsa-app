<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="diaTitle diaDesc">
  <title id="diaTitle">Les couleurs</title>
  <desc id="diaDesc">Cinq échantillons arrondis : rouge, bleu, vert, jaune et orange, chacun avec son nom en français et en arabe.</desc>
  <rect width="640" height="360" fill="#fffaf0"/>
  <rect x="12" y="12" width="616" height="56" rx="18" fill="#1f6b3a"/>
  <text x="32" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fffaf0">Les couleurs — الألوان</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="24" y="100" width="108" height="132" rx="20" fill="#e5484d" stroke="#1f2937" stroke-width="4"/>
      <text x="78" y="258" font-size="18" font-weight="bold" fill="#1f2937">rouge</text>
      <text x="78" y="288" font-size="18" fill="#e5484d" direction="rtl">أحمر</text>
    </g>
    <g>
      <rect x="146" y="100" width="108" height="132" rx="20" fill="#2f7fd1" stroke="#1f2937" stroke-width="4"/>
      <text x="200" y="258" font-size="18" font-weight="bold" fill="#1f2937">bleu</text>
      <text x="200" y="288" font-size="18" fill="#2f7fd1" direction="rtl">أزرق</text>
    </g>
    <g>
      <rect x="268" y="100" width="108" height="132" rx="20" fill="#2e8b57" stroke="#1f2937" stroke-width="4"/>
      <text x="322" y="258" font-size="18" font-weight="bold" fill="#1f2937">vert</text>
      <text x="322" y="288" font-size="18" fill="#2e8b57" direction="rtl">أخضر</text>
    </g>
    <g>
      <rect x="390" y="100" width="108" height="132" rx="20" fill="#f4c542" stroke="#1f2937" stroke-width="4"/>
      <text x="444" y="258" font-size="18" font-weight="bold" fill="#1f2937">jaune</text>
      <text x="444" y="288" font-size="18" fill="#c99a10" direction="rtl">أصفر</text>
    </g>
    <g>
      <rect x="512" y="100" width="108" height="132" rx="20" fill="#f08a24" stroke="#1f2937" stroke-width="4"/>
      <text x="566" y="258" font-size="18" font-weight="bold" fill="#1f2937">orange</text>
      <text x="566" y="288" font-size="18" fill="#f08a24" direction="rtl">برتقالي</text>
    </g>
  </g>
  <text x="320" y="336" font-family="sans-serif" font-size="16" fill="#1f6b3a" text-anchor="middle">Mélangeons les couleurs pour en créer de nouvelles !</text>
</svg>
