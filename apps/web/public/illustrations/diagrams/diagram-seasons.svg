<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="diaTitle diaDesc">
  <title id="diaTitle">Les quatre saisons</title>
  <desc id="diaDesc">Quatre panneaux pour le printemps, l'été, l'automne et l'hiver avec des symboles météo et les étiquettes ربيع، صيف، خريف، شتاء.</desc>
  <rect width="640" height="360" fill="#fffaf0"/>
  <rect x="12" y="12" width="616" height="56" rx="18" fill="#1f6b3a"/>
  <text x="32" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fffaf0">Les saisons — فصول السنة</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="18" y="88" width="142" height="218" rx="18" fill="#e8f5ec" stroke="#2e8b57" stroke-width="4"/>
      <path d="M82 224v-42" stroke="#7a5230" stroke-width="10" stroke-linecap="round"/>
      <circle cx="88" cy="154" r="30" fill="#3fa662"/><circle cx="60" cy="172" r="22" fill="#2e8b57"/><circle cx="114" cy="174" r="22" fill="#3fa662"/>
      <g fill="#f48fb1"><circle cx="62" cy="146" r="5"/><circle cx="110" cy="142" r="5"/><circle cx="92" cy="180" r="5"/></g>
      <text x="89" y="264" font-size="18" font-weight="bold" fill="#1f2937">printemps</text>
      <text x="89" y="292" font-size="19" fill="#2e8b57" direction="rtl">ربيع</text>
    </g>
    <g>
      <rect x="174" y="88" width="142" height="218" rx="18" fill="#fff3d6" stroke="#f4c542" stroke-width="4"/>
      <g stroke="#f08a24" stroke-width="6" stroke-linecap="round"><path d="M245 116v-14M245 208v14M192 162h-14M312 162h14M207 124l-10-10M293 200l10 10M283 124l10-10M207 200l-10 10"/></g>
      <circle cx="245" cy="162" r="34" fill="#f4c542" stroke="#f08a24" stroke-width="4"/>
      <path d="M232 160q6 8 12 0M250 160q6 8 12 0" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M236 174q9 8 18 0" fill="none" stroke="#1f2937" stroke-width="2.5" stroke-linecap="round"/>
      <text x="245" y="264" font-size="18" font-weight="bold" fill="#1f2937">été</text>
      <text x="245" y="292" font-size="19" fill="#f08a24" direction="rtl">صيف</text>
    </g>
    <g>
      <rect x="330" y="88" width="142" height="218" rx="18" fill="#fff1e3" stroke="#f08a24" stroke-width="4"/>
      <path d="M401 226v-46" stroke="#7a5230" stroke-width="10" stroke-linecap="round"/>
      <circle cx="400" cy="152" r="30" fill="#f08a24"/><circle cx="372" cy="172" r="21" fill="#e2622a"/><circle cx="428" cy="172" r="21" fill="#f4c542"/>
      <path d="M356 206q10-12 18 0-8 10-18 0zM430 216q10-12 18 0-8 10-18 0z" fill="#c9541f"/>
      <text x="401" y="264" font-size="18" font-weight="bold" fill="#1f2937">automne</text>
      <text x="401" y="292" font-size="19" fill="#f08a24" direction="rtl">خريف</text>
    </g>
    <g>
      <rect x="486" y="88" width="142" height="218" rx="18" fill="#e9f4ff" stroke="#2f7fd1" stroke-width="4"/>
      <g stroke="#2f7fd1" stroke-width="5" stroke-linecap="round">
        <path d="M557 122v80M522 142l70 40M592 142l-70 40"/>
        <path d="M547 130l10 10M567 130l-10 10M547 194l10-10M567 194l-10-10"/>
      </g>
      <circle cx="557" cy="162" r="8" fill="#ffffff" stroke="#2f7fd1" stroke-width="3"/>
      <g fill="#2f7fd1"><circle cx="518" cy="210" r="4"/><circle cx="598" cy="206" r="4"/><circle cx="540" cy="232" r="4"/></g>
      <text x="557" y="264" font-size="18" font-weight="bold" fill="#1f2937">hiver</text>
      <text x="557" y="292" font-size="19" fill="#2f7fd1" direction="rtl">شتاء</text>
    </g>
  </g>
  <text x="320" y="336" font-family="sans-serif" font-size="16" fill="#1f6b3a" text-anchor="middle">Chaque saison apporte son temps et ses couleurs.</text>
</svg>
