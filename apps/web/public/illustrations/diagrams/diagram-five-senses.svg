  <title id="diaTitle">Les cinq sens</title>
  <desc id="diaDesc">Cinq icônes : un œil pour la vue, une oreille pour l'ouïe, un nez pour l'odorat, une langue pour le goût et une main pour le toucher, avec les noms en français et en arabe.</desc>
