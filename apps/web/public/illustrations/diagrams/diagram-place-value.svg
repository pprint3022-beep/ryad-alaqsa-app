      <rect x="234" y="88" width="172" height="40" rx="16" fill="#f08a24"/>
      <text x="320" y="116" font-size="18" font-weight="bold" fill="#ffffff">عشرات / dizaines</text>
      <text x="320" y="196" font-size="64" font-weight="bold" fill="#f08a24">4</text>
      <g fill="#ff9f1c" stroke="#c96d0e" stroke-width="2">
        <rect x="256" y="220" width="12" height="30" rx="3"/>
        <rect x="294" y="220" width="12" height="30" rx="3"/>
        <rect x="332" y="220" width="12" height="30" rx="3"/>
        <rect x="370" y="220" width="12" height="30" rx="3"/>
