  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="34" y="88" width="172" height="186" rx="16" fill="#e8f5ec" stroke="#1f6b3a" stroke-width="4"/>
      <rect x="34" y="88" width="172" height="40" rx="16" fill="#1f6b3a"/>
      <text x="120" y="116" font-size="18" font-weight="bold" fill="#ffffff">مئات / centaines</text>
