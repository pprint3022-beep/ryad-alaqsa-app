<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="diaTitle diaDesc">
  <title id="diaTitle">Les formes géométriques</title>
  <desc id="diaDesc">Quatre formes : un cercle, un carré, un triangle et un rectangle, avec leurs noms en français et en arabe.</desc>
  <rect width="640" height="360" fill="#fffaf0"/>
  <rect x="12" y="12" width="616" height="56" rx="18" fill="#1f6b3a"/>
  <text x="32" y="48" font-family="sans-serif" font-size="24" font-weight="bold" fill="#fffaf0">Les formes — الأشكال</text>
  <g stroke="#1f2937" stroke-width="4" stroke-linejoin="round">
    <circle cx="95" cy="172" r="50" fill="#2e8b57"/>
    <rect x="187" y="122" width="100" height="100" rx="8" fill="#f08a24"/>
    <path d="M375 116l52 100h-104z" fill="#f4c542"/>
    <rect x="455" y="130" width="130" height="84" rx="8" fill="#2f7fd1"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="19" font-weight="bold" fill="#1f2937">
    <text x="95" y="270">cercle</text><text x="237" y="270">carré</text><text x="375" y="270">triangle</text><text x="520" y="270">rectangle</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle" font-size="19" fill="#1f6b3a" direction="rtl">
    <text x="95" y="302">دائرة</text><text x="237" y="302">مربع</text><text x="375" y="302">مثلث</text><text x="520" y="302">مستطيل</text>
  </g>
  <rect x="120" y="322" width="400" height="30" rx="12" fill="#fff1d8"/>
  <text x="320" y="343" font-family="sans-serif" font-size="16" fill="#f08a24" text-anchor="middle">Chaque forme a un nom et une silhouette particuliers.</text>
</svg>
