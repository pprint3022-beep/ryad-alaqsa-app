  <title id="diaTitle">La multiplication : 4 × 3 = 12</title>
  <desc id="diaDesc">Quatre sacs contenant chacun trois pommes, soit douze pommes en tout. Légende : 4 × 3 = 12 et٤ × ٣ = ١٢.</desc>
