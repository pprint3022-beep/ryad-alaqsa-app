<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="diaTitle diaDesc">
  <title id="diaTitle">Les états de la matière</title>
  <desc id="diaDesc">Trois panneaux : solide avec une pierre, liquide avec de l'eau dans un récipient, gaz avec des particules qui flottent. Étiquettes صلب، سائل، غاز.</desc>
  <rect width="640" height="360" fill="#fffaf0"/>
  <rect x="12" y="12" width="616" height="56" rx="18" fill="#1f6b3a"/>
  <text x="32" y="48" font-family="sans-serif" font-size="22" font-weight="bold" fill="#fffaf0">Les états de la matière — حالات المادة</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g>
      <rect x="22" y="88" width="186" height="212" rx="18" fill="#ffffff" stroke="#1f6b3a" stroke-width="4"/>
      <rect x="22" y="88" width="186" height="38" rx="18" fill="#1f6b3a"/>
      <text x="115" y="115" font-size="20" font-weight="bold" fill="#ffffff">solide</text>
      <path d="M60 176l22-34 42-8 34 26-10 44-52 12-36-16z" fill="#9aa3a8" stroke="#1f2937" stroke-width="4" stroke-linejoin="round"/>
      <path d="M82 142l10 38 32-20M92 180l32 24" fill="none" stroke="#6f787d" stroke-width="3"/>
      <g fill="#1f6b3a"><circle cx="68" cy="238" r="4"/><circle cx="88" cy="242" r="4"/><circle cx="108" cy="237" r="4"/><circle cx="128" cy="242" r="4"/><circle cx="148" cy="238" r="4"/></g>
      <text x="115" y="272" font-size="17" fill="#1f2937">pierre — صلب</text>
    </g>
    <g>
      <rect x="227" y="88" width="186" height="212" rx="18" fill="#ffffff" stroke="#2f7fd1" stroke-width="4"/>
      <rect x="227" y="88" width="186" height="38" rx="18" fill="#2f7fd1"/>
      <text x="320" y="115" font-size="20" font-weight="bold" fill="#ffffff">liquide</text>
      <path d="M262 140h116l-10 92q-2 14-16 14h-64q-14 0-16-14z" fill="#e7f4ff" stroke="#1f2937" stroke-width="4"/>
      <path d="M266 172q14-10 28 0t28 0 28 0 28 0v64q0 10-12 10h-60q-12 0-12-10z" fill="#4aa8e8"/>
      <path d="M278 190q10-8 20 0M312 210q10-8 20 0M292 228q9-7 18 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="320" y="272" font-size="17" fill="#1f2937">eau — سائل</text>
    </g>
    <g>
      <rect x="432" y="88" width="186" height="212" rx="18" fill="#ffffff" stroke="#f08a24" stroke-width="4"/>
      <rect x="432" y="88" width="186" height="38" rx="18" fill="#f08a24"/>
      <text x="525" y="115" font-size="20" font-weight="bold" fill="#ffffff">gaz</text>
      <rect x="470" y="138" width="110" height="98" rx="10" fill="#fffaf0" stroke="#1f2937" stroke-width="4" stroke-dasharray="6 5"/>
      <g fill="#f08a24">
        <circle cx="492" cy="160" r="5"/><circle cx="522" cy="152" r="5"/><circle cx="552" cy="166" r="5"/>
        <circle cx="508" cy="190" r="5"/><circle cx="542" cy="195" r="5"/><circle cx="566" cy="216" r="5"/>
        <circle cx="486" cy="220" r="5"/><circle cx="520" cy="226" r="5"/>
      </g>
      <text x="525" y="272" font-size="17" fill="#1f2937">air — غاز</text>
    </g>
  </g>
  <text x="320" y="326" font-family="sans-serif" font-size="17" fill="#1f6b3a" text-anchor="middle">La matière change d'état quand on la chauffe ou qu'on la refroidit.</text>
</svg>
